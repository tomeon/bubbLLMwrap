name: Flake Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    name: Flake check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # The NixOS VM test (eval-sandbox) needs KVM, which not every hosted
      # runner provides (arm64 runners may not). Without it, still evaluate
      # every check and build the ones that don't need a VM.
      - name: Check flake
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            nix flake check --impure --print-build-logs --show-trace
          else
            echo "::warning::/dev/kvm is not available on this runner; skipping the NixOS VM test"
            nix flake check --impure --no-build --show-trace
            nix build --impure --print-build-logs --show-trace \
              ".#checks.${ARCH}.options-docs" \
              ".#checks.${ARCH}.treefmt"
          fi
